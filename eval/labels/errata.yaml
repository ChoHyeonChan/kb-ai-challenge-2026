# 수동 라벨의 알려진 결함
#
# ★ 라벨 파일(*.manual.json)은 **고치지 않는다.**
#   자를 나중에 고치면 그 자로 잰 수치가 의미를 잃는다.
#   대신 검토에서 드러난 결함을 여기 기록하고, 정확도 보고서가 함께 출력한다.
#   그래야 "재현율이 낮다"는 숫자와 "왜 낮은가"를 같이 읽을 수 있다.
#
# key 는 (subject|op|value) — 정확도 스크립트의 일치 판정 기준과 같다.

errata:
  - goal_id: account_open_nonface
    key: 'context.account_type|in|["수시입출금", "외화계좌", "증권사제휴연계", "골드투자통장", "개인사업자용"]'
    label: "개설하려는 계좌가 안심차단 적용 대상인지 확인이 필요합니다"
    verdict: 라벨 오류
    finding: >-
      이 라벨은 **자동 추출이 놓친 것이 아니라, 사람이 잘못 만든 것이다.**
      원문("적용 대상은 수시입출식 계좌(외화계좌, 증권사 제휴 연계계좌, 골드투자통장 포함)이고,
      개인사업자용 계좌에도 적용됩니다")은 **안심차단이 어떤 계좌에 영향을 주는가**를 말한다.
      이것을 "계좌 종류가 이 목록에 있어야 한다"는 충족 조건으로 옮기면 방향이 뒤집힌다 —
      적금 계좌를 만들려는 사용자에게 "계좌 종류가 적용 대상이 아닙니다 → 미충족"이라는
      존재하지 않는 벽을 세우게 된다.
      LLM 은 이 문장을 is_condition=false 로 판정했고, 그 판단이 옳다.
    lesson: >-
      이 오류 유형(문서의 서술을 방향 확인 없이 조건으로 옮기기)은 이후 1차 추출 결과를 분석하며
      프롬프트 PITFALLS ① 로 명문화했다. 사람도 같은 실수를 한다는 증거다.
      우리 시스템에서 이런 조건을 막는 것은 프롬프트 규칙과 검수 관문 두 겹이다.
    recorded_at: "2026-07-29"
    reviewed_by: "조현찬"
