<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>다 됐나요? — 은행 앱 실행 실패 원인 판정</title>
<!-- 파비콘도 자작 SVG. 16px 에서는 선 세 줄이 뭉개지므로 체크 하나와 남은 하나만 남긴다. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M3 14l5 5 9-9' fill='none' stroke='%232c6349' stroke-width='4.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='23' cy='23' r='6' fill='none' stroke='%23a83226' stroke-width='3.4' stroke-dasharray='4.6 4.8'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="wrap">

  <!-- 왼쪽: 입력과 결론. 스크롤해도 화면에 남는다.
       근거를 읽는 동안 "그래서 결론이 뭐였지"가 생기지 않게 한다. -->
  <aside class="side">
    <header>
      <div class="eyebrow">해외결제 · 계좌개설이 안 될 때</div>

      <!-- 표식은 이 서비스가 하는 일 그대로다.
           조건 셋 중 둘은 확인됐고, 마지막 하나가 아직 남아 있다.
           외부 이미지·폰트를 쓰지 않는다(제3자 저작권 = 실격 조항) — 전부 자작 SVG. -->
      <div class="brand">
        <svg class="logo" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
          <g class="lg-done">
            <path d="M2 6.5l3 3 5.5-5.5"/>
            <path d="M2 16.5l3 3 5.5-5.5"/>
            <line x1="15.5" y1="6" x2="30" y2="6"/>
            <line x1="15.5" y1="16" x2="26" y2="16"/>
          </g>
          <g class="lg-left">
            <circle cx="6" cy="26" r="4"/>
            <line x1="15.5" y1="26" x2="22.5" y2="26"/>
          </g>
        </svg>
        <h1>다 됐나요?</h1>
      </div>
      <p class="sub">설정을 바꿨는데도 안 되는 이유를 <b>앱은 말해주지 않습니다.</b>
        KB 공개문서에서 뽑은 조건과 대조해 <b>근거와 함께</b> 지목합니다.</p>
      <div class="origin">
        <span class="tag real"><b>조건·근거</b> KB 공개문서</span>
        <span class="tag mock"><b>사용자 상태</b> 가상값</span>
      </div>
    </header>

    <div class="panel">
      <div class="field">
        <label for="goal">무엇을 하려다 막히셨나요</label>
        <div class="sel"><select id="goal"></select></div>
      </div>
      <div class="field">
        <label for="profile">대조할 사용자 상태</label>
        <div class="sel"><select id="profile"></select></div>
        <p class="hint">실제 서비스라면 은행이 내부에서 조회하는 값이라 고를 일이 없지만,
          데모에는 내부 조회가 없어 직접 고르게 했습니다.</p>
      </div>
      <button id="run">판정하기</button>
    </div>

    <div id="verdict"></div>
  </aside>

  <!-- 오른쪽: 근거. 아무것도 탭 뒤로 숨기지 않는다. -->
  <main>
    <!-- 처음 온 사람에게 보는 순서를 알려준다. 오버레이로 화면을 덮지 않는다 —
         심사는 30초인데 닫기 클릭을 요구하면 그 자체가 첫인상이 된다.
         번호를 쓴 것은 이것이 실제로 순서이기 때문이다. -->
    <!-- 위치("왼쪽")로 쓰지 않는다. 좁은 화면에서는 한 줄로 접혀 왼쪽이 없어진다.
         대신 무엇인지를 말한다 — 각 절의 머리말(원인·실험·근거)과 같은 말이다. -->
    <nav class="guide">
      <span><b>1</b> 판정 · 조건을 대조한 결론</span>
      <span><b>2</b> 근거 · 어느 문서의 어느 문장인지</span>
      <span><b>3</b> 실험 · 값을 바꾸면 판정이 바뀝니다</span>
    </nav>
    <div id="out"></div>
  </main>

</div>

<script src="/static/app.js" defer></script>
</body>
</html>
