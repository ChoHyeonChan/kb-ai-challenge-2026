<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>왜 안 되지? — 실행 실패 원인 판정</title>
<style>
  :root{
    --bg:#f4f4f6; --card:#fff; --ink:#1c1c1e; --sub:#6b6b70; --line:#e4e4e7;
    --bad:#c8372d; --bad-bg:#fdf2f1; --ok:#1f7a4d; --ok-bg:#f1f8f4;
    --unk:#7a6a1f; --unk-bg:#fdfaec; --accent:#f5c518;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Pretendard","Malgun Gothic","맑은 고딕",-apple-system,sans-serif;
    font-size:15px;line-height:1.6;word-break:keep-all}
  .wrap{max-width:460px;margin:0 auto;padding:16px 14px 60px}

  header{padding:10px 2px 16px}
  header h1{font-size:19px;margin:0 0 4px;letter-spacing:-.02em}
  header p{margin:0;color:var(--sub);font-size:13px}

  /* 실제/가상 경계 — 의심받을 것을 먼저 밝힌다 */
  .provenance{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 16px}
  .badge{font-size:11px;padding:3px 8px;border-radius:99px;border:1px solid var(--line);background:#fff}
  .badge.real{border-color:#bfe3cd;background:var(--ok-bg);color:var(--ok)}
  .badge.mock{border-color:#e9dcb0;background:var(--unk-bg);color:var(--unk)}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
  label{display:block;font-size:12px;color:var(--sub);margin:0 0 5px}
  select,input,button{font:inherit;width:100%;padding:10px;border:1px solid var(--line);
    border-radius:8px;background:#fff;color:var(--ink)}
  .row{margin-bottom:10px}
  button{background:var(--ink);color:#fff;border:0;font-weight:700;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}

  /* 판정 배너 */
  .verdict{border-radius:12px;padding:14px;margin-bottom:12px;border:1px solid}
  .verdict h2{margin:0 0 3px;font-size:17px}
  .verdict p{margin:0;font-size:13px}
  .v-blocked{background:var(--bad-bg);border-color:#f0cfcb;color:var(--bad)}
  .v-ok{background:var(--ok-bg);border-color:#c6e5d4;color:var(--ok)}
  .v-indeterminate{background:var(--unk-bg);border-color:#e9dcb0;color:var(--unk)}

  .group{margin-bottom:14px}
  .group>h3{font-size:12px;color:var(--sub);margin:0 0 6px;font-weight:700;letter-spacing:.02em}

  .item{background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:11px 12px;margin-bottom:7px}
  .item.bad{border-left:3px solid var(--bad)}
  .item.unk{border-left:3px solid var(--unk)}
  .item.low{border-left:3px solid #b0a0d0}
  .item .lab{display:flex;gap:7px;align-items:flex-start;font-size:14px}
  .mark{flex:0 0 auto;font-weight:700;width:14px;text-align:center}
  .mark.bad{color:var(--bad)} .mark.ok{color:var(--ok)} .mark.unk{color:var(--unk)}

  .why{margin:7px 0 0 21px;font-size:12.5px;color:var(--sub)}
  .why b{color:var(--ink)}

  /* 앱에서 못 고치는 조건 — 우리 핵심 인사이트 */
  .offapp{display:inline-block;margin-top:5px;font-size:11px;font-weight:700;
    color:#8a3b12;background:#fdf0e6;border:1px solid #f0d3bb;border-radius:5px;padding:2px 6px}

  details{margin:7px 0 0 21px}
  summary{font-size:12px;color:var(--sub);cursor:pointer;user-select:none}
  blockquote{margin:6px 0 0;padding:8px 10px;background:#fafafb;border-left:2px solid var(--accent);
    font-size:12.5px;color:#3a3a3c}
  blockquote cite{display:block;margin-top:5px;font-style:normal;font-size:11px;color:var(--sub)}

  .met-list{font-size:13px;color:var(--sub);background:var(--card);border:1px solid var(--line);
    border-radius:10px;padding:10px 12px}
  .met-list span{display:block;margin:2px 0}
  .met-list .low-note{color:#5b4a86}
  .met-list .low-note em{display:block;margin:2px 0 4px 14px;font-style:normal;
    font-size:11.5px;color:var(--sub)}

  .foot{margin-top:18px;font-size:11px;color:var(--sub);text-align:center;line-height:1.7}
  .err{background:var(--bad-bg);border:1px solid #f0cfcb;color:var(--bad);
    padding:10px;border-radius:8px;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>왜 안 되지?</h1>
    <p>은행 앱이 말해주지 않는 <b>실패의 진짜 원인</b>을 근거와 함께 지목합니다.</p>
    <div class="provenance">
      <span class="badge real">조건·근거 = 실제 KB 공개문서</span>
      <span class="badge mock">사용자 상태 = 데모용 가상값</span>
    </div>
  </header>

  <div class="panel">
    <div class="row">
      <label for="goal">무엇을 하려고 하시나요</label>
      <select id="goal"></select>
    </div>
    <div class="row">
      <label for="profile">사용자 상태 (데모)</label>
      <select id="profile"></select>
    </div>
    <button id="run">판정하기</button>
  </div>

  <div id="out"></div>

  <div class="foot">
    조건은 KB 공개 안내·약관·FAQ에서 추출했으며 각 항목에 출처와 수집일이 있습니다.<br>
    판정은 규칙 엔진이 수행하며 <b>LLM이 개입하지 않습니다</b> — 같은 입력엔 같은 결과가 나옵니다.
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function init(){
  try{
    const [goals, profiles] = await Promise.all([
      fetch("/api/goals").then(r => r.json()),
      fetch("/api/profiles").then(r => r.json()),
    ]);
    $("#goal").innerHTML = goals.map(g =>
      `<option value="${esc(g.goal_id)}">${esc(g.goal_label)} — 조건 ${g.condition_count}개</option>`).join("");
    $("#profile").innerHTML = profiles.map(p =>
      `<option value="${esc(p.profile_id)}">${esc(p.description || p.profile_id)}</option>`).join("");
  }catch(e){
    $("#out").innerHTML = `<div class="err">서버에 연결하지 못했습니다. <code>uvicorn src.api.main:app</code> 실행 중인지 확인해 주세요.</div>`;
  }
}

const VERDICT_TEXT = {
  blocked:       { cls:"v-blocked",       title:"지금은 되지 않습니다",       desc:"아래 조건이 충족되지 않았습니다." },
  ok:            { cls:"v-ok",            title:"가능합니다",                 desc:"확인한 조건을 모두 충족합니다." },
  indeterminate: { cls:"v-indeterminate", title:"확인할 수 없습니다",         desc:"판정에 필요한 정보를 알 수 없어 된다고 말씀드릴 수 없습니다." },
};

function evidenceBlock(ev){
  if(!ev) return "";
  return `<details>
    <summary>근거 보기</summary>
    <blockquote>“${esc(ev.quote)}”
      <cite>${esc(ev.source_title)} · ${esc(ev.collected_at)} 수집${ev.confidence !== "high" ? ` · 신뢰도 ${esc(ev.confidence)}` : ""}</cite>
    </blockquote>
  </details>`;
}

function unmetItem(r){
  const rem = r.remedy || {};
  const offApp = rem.actionable_in_app === false;
  return `<div class="item bad">
    <div class="lab"><span class="mark bad">✕</span><span>${esc(r.label)}</span></div>
    ${rem.primary_path ? `<div class="why">해결: <b>${esc(rem.primary_path)}</b></div>` : ""}
    ${offApp ? `<div class="why"><span class="offapp">앱에서 해결 불가</span></div>` : ""}
    ${evidenceBlock(r.evidence)}
  </div>`;
}

function simpleItem(r, cls, mark){
  return `<div class="item ${cls}">
    <div class="lab"><span class="mark ${mark}">${mark === "unk" ? "?" : "~"}</span><span>${esc(r.label)}</span></div>
    ${r.reason ? `<div class="why">${esc(r.reason)}</div>` : ""}
  </div>`;
}

function render(v){
  const t = VERDICT_TEXT[v.verdict] || VERDICT_TEXT.indeterminate;
  const counts = `조건 ${v.unmet.length + v.met.length + v.unknown.length}개 중 `
    + `미충족 ${v.unmet.length} · 충족 ${v.met.length}`
    + (v.unknown.length ? ` · 확인불가 ${v.unknown.length}` : "");

  let html = `<div class="verdict ${t.cls}"><h2>${t.title}</h2><p>${t.desc}</p></div>
    <div class="group"><h3>${esc(counts)}</h3></div>`;

  if(v.unmet.length)
    html += `<div class="group">${v.unmet.map(unmetItem).join("")}</div>`;

  if(v.unknown.length)
    html += `<div class="group"><h3>확인할 수 없는 항목</h3>
      ${v.unknown.map(r => simpleItem(r, "unk", "unk")).join("")}</div>`;

  // 해석이 개입한 조건은 별도 섹션으로 빼지 않고 충족 목록 안에서 `~` 로 표시한다.
  // (같은 조건이 두 곳에 중복 노출되는 것을 막고, 판정과 신뢰도를 한자리에서 본다)
  const lowById = new Map(v.low_confidence.map(r => [r.id, r]));
  if(v.met.length){
    const rows = v.met.map(r => {
      const low = lowById.get(r.id);
      if(!low) return `<span>✓ ${esc(r.label)}</span>`;
      return `<span class="low-note">~ ${esc(r.label)}<em>${esc(low.reason || "근거 해석이 개입함")}</em></span>`;
    }).join("");
    html += `<div class="group"><h3>충족한 항목</h3><div class="met-list">${rows}</div></div>`;
  }

  // 미충족 쪽에 해석 개입이 걸린 경우도 짚어준다
  const lowUnmet = v.unmet.filter(r => lowById.has(r.id));
  if(lowUnmet.length)
    html += `<div class="group"><h3>위 미충족 항목 중 근거 해석이 개입한 것</h3>
      ${lowUnmet.map(r => simpleItem(lowById.get(r.id), "low", "low")).join("")}</div>`;

  html += `<div class="foot">판정 엔진 v${esc(v.engine_version)} · 조건 수집일 ${esc(v.tree_collected_at)}</div>`;
  $("#out").innerHTML = html;
}

$("#run").addEventListener("click", async () => {
  const btn = $("#run");
  btn.disabled = true;
  btn.textContent = "판정 중…";
  try{
    const res = await fetch("/api/judge", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ goal_id: $("#goal").value, profile_id: $("#profile").value }),
    });
    if(!res.ok) throw new Error(await res.text());
    render(await res.json());
  }catch(e){
    $("#out").innerHTML = `<div class="err">${esc(e.message)}</div>`;
  }finally{
    btn.disabled = false;
    btn.textContent = "판정하기";
  }
});

init();
</script>
</body>
</html>
