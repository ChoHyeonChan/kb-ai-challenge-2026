<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>다 됐나요? — 은행 앱 실행 실패 원인 판정</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">실행 실패 원인 판정</div>
    <h1>다 됐나요?</h1>
    <p class="sub">하나 풀어도 안 되는 이유를 <b>앱은 말해주지 않습니다.</b><br>흩어진 약관·이용조건을 대조해 <b>근거와 함께</b> 지목합니다.</p>
    <div class="origin">
      <span class="tag real"><b>조건·근거</b> KB 공개문서에서 추출</span>
      <span class="tag mock"><b>사용자 상태</b> 데모용 가상값</span>
    </div>
  </header>

  <div class="panel">
    <div class="field">
      <label for="goal">무엇을 하려고 하시나요</label>
      <select id="goal"></select>
    </div>
    <div class="field">
      <label for="profile">사용자 상태</label>
      <select id="profile"></select>
    </div>
    <button id="run">판정하기</button>
  </div>

  <div id="out"></div>

  <p class="foot">
    조건은 KB 공개 안내·약관·FAQ에서 추출했으며 항목마다 <b>출처와 수집일</b>이 있습니다.<br>
    판정은 규칙 엔진이 수행하며 <b>LLM이 개입하지 않습니다</b> — 같은 입력엔 같은 결과가 나옵니다.
  </p>
</div>

<script src="/static/app.js" defer></script>
</body>
</html>
