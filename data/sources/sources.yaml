# 수집 대상 정의
#
# 원칙 (AGENTS.md 절대규칙 4번)
#  - robots.txt 를 확인하고, 자동 수집이 금지된 도메인은 스크립트로 받지 않는다
#  - 공시·안내 페이지만 수집한다. 로그인 뒤 개인화 페이지는 수집 대상이 아니다
#  - 요청 간격을 두고, URL 목록 지정 방식으로만 받는다 (전체 순회 금지)

meta:
  robots_checked_at: "2026-07-27"
  crawl_delay_sec: 1.5
  timeout_sec: 20
  user_agent: "KB-AI-Challenge-Research/0.1 (student contest submission; respects robots.txt)"

# ── 도메인별 robots.txt 판정 (2026-07-27 확인) ──
domains:
  - host: m.kbcard.com
    allowed: true
    robots: "Allow: /CMN/ /BON/ /CRD/ /SVC/ /FNC/ /home /cards · Disallow: /MKB/ 외 2건"
  - host: kbthink.com
    allowed: true
    robots: "User-agent: * / Allow: /"
  - host: www.kbstar.com
    allowed: true
    robots: "User-agent: * / Allow: /"
  - host: obank.kbstar.com
    allowed: false
    robots: "User-agent: * / Disallow: /  (검색엔진 봇만 Allow)"
    note: "자동 수집 금지. 아래 manual 항목으로 수동 확보한다."

# ── 자동 수집 대상 ──
