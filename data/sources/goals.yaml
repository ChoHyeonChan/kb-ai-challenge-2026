# 목표 정의
#
# 조건 자체는 문서에서 자동 추출되지만, "이 조건들이 어떤 목표에 속하는가"와
# "사용자가 그 목표를 어떤 말로 부르는가"는 문서에 적혀 있지 않다. 여기서 정의한다.
#
# aliases 는 목표 식별(resolve/)의 입력이다. 사용자가 실제로 쓸 법한 표현을 적는다.
# [현찬 판단 자리] — 표현을 추가·수정하려면 여기만 고친다.

goals:
  - id: overseas_payment_online
    label: "해외 온라인 결제"
    domain: card
    aliases:
      - "해외결제가 안돼요"
      - "해외 구독 결제 실패"
      - "직구 결제가 안 돼"
      - "해외 사이트 카드 결제 안 됨"
      - "아마존 결제가 거절돼요"
      - "달러 결제가 막혀요"

  - id: account_open_nonface
    label: "비대면 계좌개설"
    domain: account
    aliases:
      - "비대면 계좌개설이 안돼요"
      - "앱에서 통장을 못 만들어요"
      - "신분증이 계속 인식이 안 돼요"
      - "계좌 개설이 거절돼요"
      - "비대면으로 통장 개설 실패"
